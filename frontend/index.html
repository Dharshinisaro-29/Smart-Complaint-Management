
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Complaint Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Smart Complaint Management System</h1>
    <p>Register and track your complaints easily</p>
</header>

<main>
    <section class="card">
        <h2>Register a Complaint</h2>

        <form id="complaintForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" maxlength="100" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone"
                   pattern="[0-9]{10}" maxlength="10" required>

            <label for="category">Complaint Category</label>
            <select id="category" required>
                <option value="">Select Category</option>
                <option value="Water">Water</option>
                <option value="Electricity">Electricity</option>
                <option value="Cleaning">Cleaning</option>
                <option value="Maintenance">Maintenance</option>
                <option value="Other">Other</option>
            </select>

            <label for="location">Location</label>
            <input type="text" id="location" maxlength="100" required>

            <label for="description">Complaint Description</label>
            <textarea id="description" rows="4"
                      maxlength="1000" required></textarea>

            <button type="submit" id="submitButton">
                Submit Complaint
            </button>
        </form>

        <p id="submitMessage" class="message"></p>
    </section>

    <section class="card">
        <h2>Track Your Complaint</h2>

        <label for="trackId">Complaint ID</label>
        <input type="text" id="trackId"
               placeholder="Enter your complaint ID">

        <button type="button" id="trackButton">
            Track Complaint
        </button>

        <div id="trackingResult" class="result"></div>
    </section>
</main>

<footer>
    <p>AWS Serverless Microservices Project</p>
</footer>

<script src="script.js"></script>
</body>
</html>
